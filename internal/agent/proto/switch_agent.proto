syntax = "proto3";

package switchagent.v1;
option go_package = "./switchagentproto";
// Maintained in sonic-operator at internal/agent/proto/switch_agent.proto.
// Copy to network-operator at internal/transport/sonicagent/switch_agent.proto and run `make proto` in both repos after edits.


message Status {
  uint32 code = 1;
  string message = 2;
}

message GetDeviceInfoRequest {
}

message GetDeviceInfoResponse {
  Status status = 1;
  string hwsku = 2;
  string local_mac_address = 3;
  string sonic_os_version = 4;
  string asic_type = 5;
  uint32 readiness = 6;
}


// The interface message containing details about a single interface.
message Interface {
 
  string name = 1;
  string native_name = 2;
  string alias_name = 3;

  string operational_status = 4;
  string admin_status = 5;
  string mac_address = 6;
}

// The request message containing the parameters for the request.
message ListInterfacesRequest {
}

// The response message containing the list of interfaces.
message ListInterfacesResponse {
  Status status = 1;
  repeated Interface interfaces = 2;
}

message SetInterfaceAdminStatusRequest {
  string interface_name = 1;
  string admin_status = 2;
}

message SetInterfaceAdminStatusResponse {
  Status status = 1;
  Interface interface = 2;
}

message ListPortsRequest {

}

message ListPortsResponse {
  Status status = 1;
  repeated Port ports = 2;
}

message Port {
  string name = 1;
  string alias = 2;
}

message GetInterfaceNeighborRequest {
  string interface_name = 1;
}

message InterfaceNeighbor {
  string neighbor_interface_name = 1;
  string mac_address = 2;
  string system_name = 3;
}

message GetInterfaceNeighborResponse {
  Status status = 1;
  string interface = 2;
  InterfaceNeighbor neighbor = 3;
}

message GetInterfaceRequest {
  string interface_name = 1;
}

message GetInterfaceResponse {
  Status status = 1;
  Interface interface = 2;
}

message SetInterfaceAliasNameRequest {
  string interface_name = 1;
  string alias_name = 2;
}

message SetInterfaceAliasNameResponse {
  Status status = 1;
  Interface interface = 2;
}

message SaveConfigRequest {
  // Empty request
}

message SaveConfigResponse {
  Status status = 1;
}

message RebootRequest {
  // Empty request
}

message RebootResponse {
  Status status = 1;
}

message OnieBootModeInstallRequest {
  // Empty request
}

message OnieBootModeInstallResponse {
  Status status = 1;
}

message RestartSystemdServiceRequest {
  string service_name = 1;
}

message RestartSystemdServiceResponse {
  Status status = 1;
}

message RebootCauseRequest {
}

message RebootCauseResponse {
  Status status = 1;
  string cause = 2;
}

message FactoryResetRequest {
}

message FactoryResetResponse {
  Status status = 1;
}

message GetReadinessRequest {
}

// ready is true when org.SONiC.HostService is on D-Bus and all required
// host-service modules are installed and responding.
message GetReadinessResponse {
  Status status = 1;
  bool   ready  = 2;
}

// The interface service definition.
service SwitchAgentService {

  rpc GetDeviceInfo(GetDeviceInfoRequest) returns (GetDeviceInfoResponse);
  
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  rpc SetInterfaceAdminStatus(SetInterfaceAdminStatusRequest) returns (SetInterfaceAdminStatusResponse);
  rpc SetInterfaceAliasName(SetInterfaceAliasNameRequest) returns (SetInterfaceAliasNameResponse);

  rpc GetInterface(GetInterfaceRequest) returns (GetInterfaceResponse);
  rpc GetInterfaceNeighbor(GetInterfaceNeighborRequest) returns (GetInterfaceNeighborResponse);

  rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);
  // gNOI alternatives
  rpc SaveConfig (SaveConfigRequest) returns (SaveConfigResponse);
  rpc Reboot (RebootRequest) returns (RebootResponse);
  rpc OnieBootModeInstall (OnieBootModeInstallRequest) returns (OnieBootModeInstallResponse);
  rpc RestartSystemdService (RestartSystemdServiceRequest) returns (RestartSystemdServiceResponse);
  rpc RebootCause (RebootCauseRequest) returns (RebootCauseResponse);
  rpc FactoryReset (FactoryResetRequest) returns (FactoryResetResponse);
  rpc GetReadiness (GetReadinessRequest) returns (GetReadinessResponse);

}

// ── DeviceProviderService ────────────────────────────────────────────────────

message DeviceProviderListPortsRequest {}

message DevicePort {
  string id                            = 1;
  string type                          = 2;
  repeated int32 supported_speeds_gbps = 3;
  string transceiver                   = 4;
}

message DeviceProviderListPortsResponse {
  Status status         = 1;
  repeated DevicePort ports = 2;
}

message DeviceProviderGetDeviceInfoRequest {}

message DeviceInfo {
  string manufacturer     = 1;
  string model            = 2;
  string serial_number    = 3;
  string firmware_version = 4;
}

message DeviceProviderGetDeviceInfoResponse {
  Status status   = 1;
  DeviceInfo info = 2;
}

message DeviceProviderGetLastRebootTimeRequest {}

// last_reboot_time is encoded as RFC3339 string.
message DeviceProviderGetLastRebootTimeResponse {
  Status status           = 1;
  string last_reboot_time = 2;
}

message DeviceProviderRebootRequest {}

message DeviceProviderRebootResponse {
  Status status = 1;
}

message DeviceProviderFactoryResetRequest {}

message DeviceProviderFactoryResetResponse {
  Status status = 1;
}

message DeviceProviderReprovisionRequest {}

message DeviceProviderReprovisionResponse {
  Status status = 1;
}

service DeviceProviderService {
  rpc ListPorts(DeviceProviderListPortsRequest) returns (DeviceProviderListPortsResponse);
  rpc GetDeviceInfo(DeviceProviderGetDeviceInfoRequest) returns (DeviceProviderGetDeviceInfoResponse);
  rpc GetLastRebootTime(DeviceProviderGetLastRebootTimeRequest) returns (DeviceProviderGetLastRebootTimeResponse);
  rpc Reboot(DeviceProviderRebootRequest) returns (DeviceProviderRebootResponse);
  rpc FactoryReset(DeviceProviderFactoryResetRequest) returns (DeviceProviderFactoryResetResponse);
  rpc Reprovision(DeviceProviderReprovisionRequest) returns (DeviceProviderReprovisionResponse);
}

// ── InterfaceProviderService ─────────────────────────────────────────────────

message EnsureInterfaceRequest {
  string interface_name         = 1;
  string admin_status           = 2;
  string description            = 3;
  string interface_type         = 4;
  int32  mtu                    = 5;
  repeated string ipv4_prefixes = 6;
  string vrf_name               = 7;
  int32  vlan_id                = 8;
  string switchport_mode        = 9;  // "access" | "trunk" | "" (routed)
  int32  access_vlan            = 10;
  int32  native_vlan            = 11;
  repeated int32 allowed_vlans  = 12;
}

message InterfaceProviderInterfaceRequest {
  string interface_name = 1;
}

message InterfaceProviderInterfaceStatus {
  bool   oper_status  = 1;
  string oper_message = 2;
}

message EnsureInterfaceResponse {
  Status status = 1;
}

message DeleteInterfaceResponse {
  Status status = 1;
}

message GetInterfaceStatusResponse {
  Status status                                    = 1;
  InterfaceProviderInterfaceStatus interface_status = 2;
}

service InterfaceProviderService {
  rpc EnsureInterface(EnsureInterfaceRequest) returns (EnsureInterfaceResponse);
  rpc DeleteInterface(InterfaceProviderInterfaceRequest) returns (DeleteInterfaceResponse);
  rpc GetInterfaceStatus(InterfaceProviderInterfaceRequest) returns (GetInterfaceStatusResponse);
}

// ── DHCPRelayProviderService ─────────────────────────────────────────────────

message DHCPRelayProviderEnsureRequest {
  repeated string interface_names  = 1;
  repeated string server_addresses = 2;
  string          vrf_name         = 3;  // empty = default VRF
}

message DHCPRelayProviderEnsureResponse {
  Status status = 1;
}

message DHCPRelayProviderDeleteRequest {
  repeated string interface_names = 1;
}

message DHCPRelayProviderDeleteResponse {
  Status status = 1;
}

message DHCPRelayProviderGetStatusRequest {
  repeated string interface_names = 1;
}

message DHCPRelayProviderGetStatusResponse {
  Status status                         = 1;
  repeated string configured_interfaces = 2;
}

service DHCPRelayProviderService {
  rpc EnsureDHCPRelay(DHCPRelayProviderEnsureRequest)       returns (DHCPRelayProviderEnsureResponse);
  rpc DeleteDHCPRelay(DHCPRelayProviderDeleteRequest)       returns (DHCPRelayProviderDeleteResponse);
  rpc GetDHCPRelayStatus(DHCPRelayProviderGetStatusRequest) returns (DHCPRelayProviderGetStatusResponse);
}

// ── VLANProviderService ──────────────────────────────────────────────────────

message VLANProviderEnsureRequest {
  int32  vlan_id     = 1;
  string name        = 2;  // optional VLAN name; empty = leave unnamed
  string admin_state = 3;  // "up" or "down"
}

message VLANProviderEnsureResponse {
  Status status = 1;
}

message VLANProviderDeleteRequest {
  int32 vlan_id = 1;
}

message VLANProviderDeleteResponse {
  Status status = 1;
}

message VLANProviderGetStatusRequest {
  int32 vlan_id = 1;
}

message VLANProviderGetStatusResponse {
  Status status      = 1;
  bool   oper_status = 2;
}

service VLANProviderService {
  rpc EnsureVLAN(VLANProviderEnsureRequest)       returns (VLANProviderEnsureResponse);
  rpc DeleteVLAN(VLANProviderDeleteRequest)       returns (VLANProviderDeleteResponse);
  rpc GetVLANStatus(VLANProviderGetStatusRequest) returns (VLANProviderGetStatusResponse);
}

// ── LLDPProviderService ──────────────────────────────────────────────────────

message LLDPProviderInterface {
  string interface_name = 1;
  string admin_state    = 2;  // "up" or "down"
}

message LLDPProviderEnsureRequest {
  string admin_state                        = 1;  // "up" or "down"
  repeated LLDPProviderInterface interfaces = 2;
}

message LLDPProviderEnsureResponse {
  Status status = 1;
}

message LLDPProviderDeleteRequest {}

message LLDPProviderDeleteResponse {
  Status status = 1;
}

message LLDPProviderGetStatusRequest {}

message LLDPProviderGetStatusResponse {
  Status status      = 1;
  bool   oper_status = 2;
}

service LLDPProviderService {
  rpc EnsureLLDP(LLDPProviderEnsureRequest)       returns (LLDPProviderEnsureResponse);
  rpc DeleteLLDP(LLDPProviderDeleteRequest)       returns (LLDPProviderDeleteResponse);
  rpc GetLLDPStatus(LLDPProviderGetStatusRequest) returns (LLDPProviderGetStatusResponse);
}


// ── WireSonicSwitchService ───────────────────────────────────────────────────
// SPDX-FileCopyrightText: 2026 SAP SE or an SAP affiliate company and IronCore contributors
// SPDX-License-Identifier: Apache-2.0

// WireSonicSwitchService manages SONiC switch configuration via gRPC.
service WireSonicSwitchService {
  // GetDevice returns the provider-internal ID for a named device.
  rpc GetDevice(WireGetDeviceRequest) returns (WireGetDeviceResponse);

  // ApplySwitch atomically applies a full switch configuration.
  rpc ApplySwitch(ApplySwitchRequest) returns (ApplySwitchResponse);

  // DeleteSwitch removes all switch configuration from the named device.
  rpc DeleteSwitch(DeleteSwitchRequest) returns (DeleteSwitchResponse);

  // GetCellStatus returns the provisioning state recorded by the last ApplySwitch call.
  rpc GetCellStatus(GetCellStatusRequest) returns (GetCellStatusResponse);

  // GetInterface returns the provider-internal ID for a named interface.
  rpc GetInterface(WireGetInterfaceRequest) returns (WireGetInterfaceResponse);

  // GetInterfaceState returns the current operational state of an interface.
  rpc GetInterfaceState(WireGetInterfaceStateRequest) returns (WireGetInterfaceStateResponse);

  // SetInterfaceAdminState sets the admin state (up/down) of an interface.
  rpc SetInterfaceAdminState(WireSetInterfaceAdminStateRequest) returns (WireSetInterfaceAdminStateResponse);

	// ListInterfaces returns the names of all interfaces known to the switch.
  rpc ListInterfacesV2(ListInterfacesRequestV2) returns (ListInterfacesResponseV2);
}
// ── Device ───────────────────────────────────────────────────────────────────

message WireGetDeviceRequest {
  // device is the Kubernetes object name of the Device (e.g. "spine-2").
  string device = 1;
}

message WireGetDeviceResponse {
  // device_id is the SONiC-internal identifier for the device.
  string device_id = 1;
}

// ── Switch configuration ─────────────────────────────────────────────────────

message ApplySwitchRequest {
  // device is the Kubernetes object name of the Device.
  string device = 1;
  SwitchConfig config = 2;
}

message ApplySwitchResponse {}

message DeleteSwitchRequest {
  // device is the Kubernetes object name of the Device.
  string device = 1;
}

message DeleteSwitchResponse {
  // state is "" when reprovision is complete, "Reprovisioning" while in progress.
  string state = 1;
}

message GetCellStatusRequest {
  string device = 1;
}

// GetCellStatusResponse reports the provisioning state last written by ApplySwitch.
// state is "Creating", "Active", "Error", or "" (key absent — cell not yet provisioned).
message GetCellStatusResponse {
  string state   = 1;
  string message = 2;
}

message SwitchConfig {
  SwitchMetadata metadata = 1;
  string hostname = 2;
  // loopback_ips are CIDR prefixes for the loopback interface (e.g. "192.168.1.2/32").
  repeated string loopback_ips = 3;
  // prefixes are advertised IP prefixes (e.g. "10.0.0.0/16").
  repeated string prefixes = 4;
  repeated VLAN vlans = 5;
  // bgp is optional; omit when BGP is not configured.
  BGPConfig bgp = 6;
}

message SwitchMetadata {
  string namespace = 1;
  string name = 2;
  string uid = 3;
}

// ── VLAN ──────────────────────────────────────────────────────────────────────

message VLAN {
  int32 id = 1;
  // prefix is the CIDR subnet for this VLAN (e.g. "192.168.100.0/24").
  string prefix = 2;
  // dhcp_relay is the DHCP relay IP; empty string means no relay.
  string dhcp_relay = 3;
  repeated VLANMember members = 4;
}

message VLANMember {
  // interface_id is the SONiC-internal port identifier (e.g. "Ethernet0").
  string interface_id = 1;
}

// ── BGP ───────────────────────────────────────────────────────────────────────

message BGPConfig {
  uint32 asn = 1;
  string router_id = 2;
  repeated BGPPeerGroup peer_groups = 3;
}

message BGPPeerGroup {
  string name = 1;
  repeated BGPNeighbor neighbors = 2;
}

// BGPNeighbor represents one BGP peer. Exactly one of vlan_id or interface_id
// is set; vlan_id > 0 means a VLAN-based unnumbered peer.
message BGPNeighbor {
  // vlan_id is set when the neighbor is VLAN-based.
  int32 vlan_id = 1;
  // interface_id is set when the neighbor is interface-based.
  string interface_id = 2;
}

// ── Interface ─────────────────────────────────────────────────────────────────

message WireGetInterfaceRequest {
  // iface is the Kubernetes DeviceInterface object name.
  string iface = 1;
}

message WireGetInterfaceResponse {
  // interface_id is the SONiC-internal port identifier (e.g. "Ethernet0").
  string interface_id = 1;
}

message WireGetInterfaceStateRequest {
  // iface is the Kubernetes DeviceInterface object name.
  string iface = 1;
}

message WireGetInterfaceStateResponse {
  bool admin_up = 1;
  bool oper_up  = 2;
}

message WireSetInterfaceAdminStateRequest {
  // iface is the Kubernetes DeviceInterface object name.
  string iface = 1;
  bool admin_state = 2;
}

message WireSetInterfaceAdminStateResponse {}

message ListInterfacesRequestV2 {}

message ListInterfacesResponseV2 {
  // interfaces is the list of interface names (e.g. "Ethernet0", "Ethernet4").
  repeated string interfaces = 1;
}

